[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clean_sar"
version = "0.2.0"
description = "Complex SAR Hogbom CLEAN Deconvolution with Spatially-Varying IPR for NITF SICDs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "sarkit",
    "lxml",
]

[project.optional-dependencies]
viz = ["matplotlib", "pillow"]
dev = ["pytest", "matplotlib", "pillow"]

[project.scripts]
clean-sar = "clean_sar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clean_sar*"]
exclude = ["tests*", "tools*", "output*", "scratch*", "audit*", "docs*"]

[tool.setuptools.package-data]
"clean_sar.backends" = ["c_src/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


